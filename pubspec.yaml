name: vendemas
description: "Vende Móvil - Sistema POS con escáner de código de barras e impresión térmica"
publish_to: 'none'
version: 2.0.0+2

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.6
  mobile_scanner: ^7.0.1
  intl: ^0.20.2
  google_fonts: ^6.2.1
  permission_handler: ^11.4.0
  provider: ^6.1.4
  uuid: ^4.5.1
  share_plus: ^11.0.0
  shared_preferences: ^2.5.3
  print_bluetooth_thermal: ^1.2.1
  esc_pos_utils_plus: ^2.0.4
  image_picker: ^1.2.3
  excel: ^4.0.6
  audioplayers: ^6.7.1
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/icon/
    - assets/sounds/
    - assets/imgvendemovil.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/logo.png"
